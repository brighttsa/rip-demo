<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Halden Instruments — Colour System</title>
<style>
  body { margin:0; background:#f4f2ee; color:#1b1c1e; font: 400 17px/1.5 -apple-system, "SF Pro Text", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 72px 32px; }
  h1 { font: 700 40px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing:-.02em; margin:0 0 8px; }
  .sub { color:#6b6e74; margin:0 0 56px; }
  .label { font: 600 12px/1 -apple-system, sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#6b6e74; margin: 0 0 16px; }
  /* A single, flat, near-uniform block: the single-HEX case. */
  .hero-swatch { width: 100%; height: 240px; border-radius: 18px; background:#E4572E; margin-bottom: 64px; }
  /* Five distinct solid blocks on a contrasting canvas: the palette case. */
  .strip { display:flex; gap:14px; padding: 28px; background:#ffffff; border-radius: 22px; }
  .strip div { flex:1; height:150px; border-radius:14px; }
</style>
</head>
<body>
<main>
  <h1>Colour System</h1>
  <p class="sub">Halden Instruments brand palette, revision 4.</p>
  <div class="label">Signal</div>
  <div class="hero-swatch" id="hero-swatch"></div>
  <div class="label">Core palette</div>
  <div class="strip" id="palette">
    <div style="background:#1D2A3A"></div>
    <div style="background:#2F5D8A"></div>
    <div style="background:#7FB7BE"></div>
    <div style="background:#F2C14E"></div>
    <div style="background:#E4572E"></div>
  </div>
</main>
<footer style="max-width:720px;margin:160px auto 48px;padding:0 24px;font:400 13px/1.5 -apple-system,sans-serif;color:#9a9ca1">Demo content for the RIP product film. Halden Instruments and The Field Journal are fictional.</footer>
</body>
</html>
